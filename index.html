<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Find work across East Africa. Browse jobs in Kenya, Uganda, Tanzania, Rwanda and Ethiopia and apply with your phone.">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Kazi">
<meta property="og:title" content="Kazi: jobs across East Africa">
<meta property="og:description" content="Find work across East Africa. Apply in under a minute with just your name and phone.">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#fafaf7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#151a10" media="(prefers-color-scheme: dark)">
<title>Kazi — Jobs across East Africa</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=Space+Grotesk:wght@500;600&display=swap" rel="stylesheet">
<style>
/* shadcn/ui preset b6TqMNb5Wb — style: mira · base color: olive · theme: lime · radix · RTL
   fonts: IBM Plex Sans / Space Grotesk headings · icons: Phosphor · radius: default */
:root{
  --radius:.625rem;
  --r-sm:calc(var(--radius) - 4px); --r-md:calc(var(--radius) - 2px); --r-lg:var(--radius); --r-xl:calc(var(--radius) + 4px);
  --background:oklch(100% 0 0); --foreground:oklch(15.3% .006 107.1);
  --card:oklch(100% 0 0); --card-foreground:oklch(15.3% .006 107.1);
  --popover:oklch(100% 0 0); --popover-foreground:oklch(15.3% .006 107.1);
  --primary:oklch(53.2% .157 131.589); --primary-foreground:oklch(98.6% .031 120.757);
  --secondary:oklch(96.6% .005 106.5); --secondary-foreground:oklch(22.8% .013 107.4);
  --muted:oklch(96.6% .005 106.5); --muted-foreground:oklch(46.6% .025 107.3);
  --accent:oklch(96.6% .005 106.5); --accent-foreground:oklch(22.8% .013 107.4);
  --destructive:oklch(57.7% .245 27.325);
  --border:oklch(93% .007 106.5); --input:oklch(88% .011 106.6); --ring:oklch(64.8% .2 131.684);
  --page:oklch(98.8% .003 106.5);
  --success:oklch(50.8% .118 165.612); --success-bg:oklch(97.9% .021 166.113);
  --c1:#0b5cd5; --c1-bg:#e6f0fd; --c2:#8a5a00; --c2-bg:#fdf3dc; --c3:#b3261e; --c3-bg:#fdecea;
  --c4:#17692f; --c4-bg:#e6f4ea; --c5:#6d3fc0; --c5-bg:#f0eafb; --c6:#07646c; --c6-bg:#e0f4f5;
  --shadow-xs:0 1px 2px 0 rgb(0 0 0 / .05);
  --shadow-sm:0 1px 3px 0 rgb(0 0 0 / .1),0 1px 2px -1px rgb(0 0 0 / .1);
  --shadow-lg:0 10px 15px -3px rgb(0 0 0 / .1),0 4px 6px -4px rgb(0 0 0 / .1);
  --overlay:rgb(0 0 0 / .5);
  --font-sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans Arabic","Helvetica Neue",Arial,sans-serif;
  --font-heading:"Space Grotesk","IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans Arabic",Arial,sans-serif;
  --gutter:16px;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --background:oklch(15.3% .006 107.1); --foreground:oklch(98.8% .003 106.5);
    --card:oklch(22.8% .013 107.4); --card-foreground:oklch(98.8% .003 106.5);
    --popover:oklch(22.8% .013 107.4); --popover-foreground:oklch(98.8% .003 106.5);
    --primary:oklch(84.1% .238 128.85); --primary-foreground:oklch(27.4% .072 132.109);
    --secondary:oklch(28.6% .016 107.4); --secondary-foreground:oklch(98.8% .003 106.5);
    --muted:oklch(28.6% .016 107.4); --muted-foreground:oklch(73.7% .021 106.9);
    --accent:oklch(28.6% .016 107.4); --accent-foreground:oklch(98.8% .003 106.5);
    --destructive:oklch(70.4% .191 22.216);
    --border:oklch(100% 0 0 / 10%); --input:oklch(100% 0 0 / 15%); --ring:oklch(76.8% .233 130.85);
    --page:oklch(12.5% .005 107);
    --success:oklch(76.5% .177 163.223); --success-bg:oklch(26.2% .051 172.552);
    --c1:#6cb0ff; --c1-bg:#10233c; --c2:#f7b955; --c2-bg:#2e2310; --c3:#ff8a85; --c3-bg:#331516;
    --c4:#5dc36f; --c4-bg:#13291a; --c5:#b79bf0; --c5-bg:#241a3a; --c6:#4fd1da; --c6-bg:#0f2b2e;
    --overlay:rgb(0 0 0 / .7);
  }
}
:root[data-theme="dark"]{
  --background:oklch(15.3% .006 107.1); --foreground:oklch(98.8% .003 106.5);
  --card:oklch(22.8% .013 107.4); --card-foreground:oklch(98.8% .003 106.5);
  --popover:oklch(22.8% .013 107.4); --popover-foreground:oklch(98.8% .003 106.5);
  --primary:oklch(84.1% .238 128.85); --primary-foreground:oklch(27.4% .072 132.109);
  --secondary:oklch(28.6% .016 107.4); --secondary-foreground:oklch(98.8% .003 106.5);
  --muted:oklch(28.6% .016 107.4); --muted-foreground:oklch(73.7% .021 106.9);
  --accent:oklch(28.6% .016 107.4); --accent-foreground:oklch(98.8% .003 106.5);
  --destructive:oklch(70.4% .191 22.216);
  --border:oklch(100% 0 0 / 10%); --input:oklch(100% 0 0 / 15%); --ring:oklch(76.8% .233 130.85);
  --page:oklch(12.5% .005 107);
  --success:oklch(76.5% .177 163.223); --success-bg:oklch(26.2% .051 172.552);
  --c1:#6cb0ff; --c1-bg:#10233c; --c2:#f7b955; --c2-bg:#2e2310; --c3:#ff8a85; --c3-bg:#331516;
  --c4:#5dc36f; --c4-bg:#13291a; --c5:#b79bf0; --c5-bg:#241a3a; --c6:#4fd1da; --c6-bg:#0f2b2e;
  --overlay:rgb(0 0 0 / .7);
}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
*,*::before,*::after{box-sizing:border-box;border-color:var(--border)}
[hidden]{display:none !important}
body{margin:0;background:var(--page);color:var(--foreground);font:400 14px/20px var(--font-sans);-webkit-font-smoothing:antialiased;min-height:100vh}
h1,h2,h3,p,ul,ol{margin:0;padding:0} ul,ol{list-style:none}
h1,h2,h3,.brand,.dialog-title,.empty-title,.card-title,.row-title,.page-title{font-family:var(--font-heading)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--ring);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.wrap{max-width:1200px;margin:0 auto;padding-inline:var(--gutter)}
.muted{color:var(--muted-foreground)} .xs{font-size:12px;line-height:16px}
.pay,.bidi{unicode-bidi:isolate}
@media (min-width:768px){:root{--gutter:24px}} @media (min-width:1024px){:root{--gutter:32px}}
.ic{width:16px;height:16px;fill:currentColor;flex:none}
.ic.lg{width:20px;height:20px}
[dir="rtl"] .flip{transform:scaleX(-1)}

/* Layout */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in oklab,var(--background) 82%,transparent);-webkit-backdrop-filter:saturate(180%) blur(12px);backdrop-filter:saturate(180%) blur(12px);border-bottom:1px solid transparent;transition:border-color .2s}
.top.scrolled{border-bottom-color:var(--border)}
.top-search{display:none;align-items:center;gap:8px;flex:1;max-width:360px;height:36px;margin-inline-start:auto;padding-inline:10px;border:1px solid var(--input);border-radius:var(--r-md);background:var(--background);color:var(--muted-foreground);transition:border-color .15s,box-shadow .15s}
.top-search:focus-within{border-color:var(--ring);box-shadow:0 0 0 3px color-mix(in oklab,var(--ring) 30%,transparent)}
.top-search .ic{width:16px;height:16px}
.ts-input{flex:1;min-width:0;height:100%;border:0;outline:none;background:transparent;color:var(--foreground);font-size:13px}
.ts-input::-webkit-search-cancel-button{-webkit-appearance:none}
.kbd{display:none;align-items:center;justify-content:center;min-width:20px;height:20px;padding:0 6px;border:1px solid var(--border);border-radius:var(--r-sm);background:var(--muted);color:var(--muted-foreground);font-family:var(--font-sans);font-size:11px;font-weight:500}
.sb-input:not(:placeholder-shown) ~ .kbd,.searchbar:focus-within .kbd{display:none !important}
.top .wrap{display:flex;align-items:center;gap:8px;height:52px}
.brand{display:flex;align-items:center;gap:8px;font-size:18px;line-height:28px;font-weight:600;letter-spacing:-.01em}
.brand-mark{width:28px;height:28px;border-radius:var(--r-md);background:var(--primary);color:var(--primary-foreground);display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:600}
.brand small{font-family:var(--font-sans);font-size:12px;font-weight:500;color:var(--muted-foreground);letter-spacing:0}
button.brand{background:none;border:0;padding:0;color:inherit;cursor:pointer;text-align:start;border-radius:var(--r-md)}
.lang-btn{font-weight:600;letter-spacing:.02em}
.top-actions{display:flex;align-items:center;gap:8px;margin-inline-start:auto}
.post-cta{display:none}
.menu-wrap{position:relative}
.menu{position:absolute;inset-inline-end:0;top:calc(100% + 8px);min-width:224px;padding:4px;background:var(--popover);color:var(--popover-foreground);border:1px solid var(--border);border-radius:var(--r-lg);box-shadow:var(--shadow-lg);z-index:50;animation:enter .12s ease-out}
.menu-label{padding:6px 8px;font-size:12px;line-height:16px;font-weight:500;color:var(--muted-foreground)}
.menu-sep{height:1px;background:var(--border);margin:4px -4px}
.menu button{display:flex;align-items:center;gap:8px;width:100%;min-height:44px;padding:0 8px;border:0;border-radius:var(--r-sm);background:none;font-size:13px;text-align:start;cursor:pointer}
.menu button:hover,.menu button:focus-visible{background:var(--accent);color:var(--accent-foreground);outline:none}
.menu .mcheck{margin-inline-start:auto;visibility:hidden;color:var(--primary)}
.menu button[aria-checked="true"] .mcheck{visibility:visible}
.topnav-link .badge{min-width:20px;padding:0 6px}
main{padding:24px 0 calc(64px + 32px + env(safe-area-inset-bottom,0px))}
.page-title{font-size:24px;line-height:32px;font-weight:600;letter-spacing:-.02em}
.page-title:focus{outline:none}
.page-desc{margin-top:4px;max-width:680px;color:var(--muted-foreground)}
.section-title{font-size:14px;line-height:20px;font-weight:600;margin:0 0 8px}
.h2{font-size:18px;line-height:28px;font-weight:600;letter-spacing:-.01em}

/* Bottom navigation (mobile) */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;justify-content:center;background:var(--background);border-top:1px solid var(--border);padding-bottom:env(safe-area-inset-bottom,0px)}
.nav button{flex:1;max-width:160px;min-height:64px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;background:none;border:0;color:var(--muted-foreground);font-size:12px;line-height:16px;font-weight:500;cursor:pointer;transition:color .15s}
.nav .nav-ic{display:flex;align-items:center;justify-content:center;width:48px;height:32px;border-radius:9999px;transition:background .15s}
.nav .nav-ic .ic{width:20px;height:20px}
.nav button:hover{color:var(--foreground)}
.nav button[aria-current="page"]{color:var(--foreground)}
.nav button[aria-current="page"] .nav-ic{background:var(--accent)}
.nav button.post{color:var(--foreground)}
.nav button.post .nav-ic{background:var(--primary);color:var(--primary-foreground)}
.nav button.post:hover .nav-ic{background:color-mix(in oklab,var(--primary) 90%,transparent)}
.topnav{display:none}

/* Button (mira: compact) */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap;height:32px;min-height:44px;padding:0 12px;border-radius:var(--r-md);border:1px solid transparent;font-size:13px;line-height:20px;font-weight:500;cursor:pointer;text-decoration:none;transition:background-color .15s,color .15s,border-color .15s,box-shadow .15s}
.btn:disabled{pointer-events:none;opacity:.5}
.btn.primary{background:var(--primary);color:var(--primary-foreground)}
.btn.primary:hover{background:color-mix(in oklab,var(--primary) 85%,transparent)}
.btn.outline{background:var(--background);border-color:var(--input);color:var(--foreground)}
.btn.outline:hover,.btn.ghost:hover{background:var(--accent);color:var(--accent-foreground)}
.btn.ghost{background:transparent;color:var(--foreground)}
.btn.sm{height:28px;padding:0 10px}
.btn.block{width:100%}
.btn.icon{width:44px;padding:0;flex:none}
.btn.icon .ic{width:18px;height:18px}
.btn.icon.on{color:var(--primary)}

/* Input, Textarea, Label, Select */
.field-group{display:grid;gap:6px}
.field-group label,.label{font-size:13px;line-height:16px;font-weight:500}
.input{width:100%;height:32px;min-height:44px;padding:4px 10px;border:1px solid var(--input);border-radius:var(--r-md);background:transparent;font-size:16px;line-height:24px;outline:none;transition:border-color .15s,box-shadow .15s}
.input::placeholder{color:var(--muted-foreground)}
.input:focus-visible{border-color:var(--ring);box-shadow:0 0 0 3px color-mix(in oklab,var(--ring) 35%,transparent)}
.input[aria-invalid="true"]{border-color:var(--destructive);box-shadow:0 0 0 3px color-mix(in oklab,var(--destructive) 20%,transparent)}
textarea.input{height:auto;min-height:80px;padding:8px 10px;resize:vertical}
select.input{appearance:none;padding-inline-end:32px;background-image:linear-gradient(45deg,transparent 50%,var(--muted-foreground) 50%),linear-gradient(135deg,var(--muted-foreground) 50%,transparent 50%);background-position:calc(100% - 18px) 50%,calc(100% - 13px) 50%;background-size:5px 5px;background-repeat:no-repeat}
[dir="rtl"] select.input{background-position:18px 50%,13px 50%}
input[type="tel"],input[inputmode="numeric"]{direction:ltr;text-align:start}
[dir="rtl"] input[type="tel"],[dir="rtl"] input[inputmode="numeric"]{text-align:right}
.field-desc{font-size:12px;line-height:16px;color:var(--muted-foreground)}
.field-error{font-size:12px;line-height:16px;color:var(--destructive)}
.search{position:relative;flex:1}
.search .ic{position:absolute;inset-inline-start:10px;top:50%;transform:translateY(-50%);color:var(--muted-foreground);pointer-events:none}
.search .input{padding-inline-start:32px}

/* Badge */
.badge{display:inline-flex;align-items:center;justify-content:center;gap:4px;width:fit-content;padding:2px 8px;border-radius:var(--r-md);border:1px solid transparent;font-size:12px;line-height:16px;font-weight:500;white-space:nowrap}
.badge.default{background:var(--primary);color:var(--primary-foreground)}
.badge.secondary{background:var(--secondary);color:var(--secondary-foreground)}
.badge.outline{border-color:var(--input);color:var(--foreground)}
.badge.ok{background:var(--success-bg);color:var(--success)}
.badge.c1{background:var(--c1-bg);color:var(--c1)} .badge.c2{background:var(--c2-bg);color:var(--c2)} .badge.c3{background:var(--c3-bg);color:var(--c3)}
.badge.c4{background:var(--c4-bg);color:var(--c4)} .badge.c5{background:var(--c5-bg);color:var(--c5)} .badge.c6{background:var(--c6-bg);color:var(--c6)}
.badge .ic{width:12px;height:12px}
button.badge{cursor:pointer;min-height:32px;padding:2px 12px;transition:background-color .15s}
button.badge.secondary:hover{background:color-mix(in oklab,var(--secondary) 80%,var(--foreground))}
.badges{display:flex;flex-wrap:wrap;gap:8px}

/* Card */
.grid{display:grid;gap:16px;max-width:880px}
.card{position:relative;display:flex;flex-direction:column;gap:16px;padding:16px 0;background:var(--card);color:var(--card-foreground);border:1px solid var(--border);border-radius:var(--r-xl);box-shadow:var(--shadow-xs)}
@media (min-width:768px){.card{padding:20px 0}}
.card-header{display:grid;grid-template-columns:1fr auto;align-items:start;gap:2px 8px;padding:0 16px}
@media (min-width:768px){.card-header,.card-content,.card-footer{padding-inline:20px}}
.card-title{font-size:16px;line-height:24px;font-weight:600;letter-spacing:-.01em}
.card-desc{font-size:13px;line-height:20px;color:var(--muted-foreground);grid-column:1}
.card-content{padding:0 16px}
.card-footer{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:0 16px}
.card-link{all:unset;cursor:pointer}
.card-link::after{content:"";position:absolute;inset:0}
.card-link:focus-visible{outline:none}
.card-link:focus-visible::after{outline:2px solid var(--ring);outline-offset:-2px}
.pay{font-weight:500;color:var(--primary)}
.has-logo{grid-template-columns:40px minmax(0,1fr) auto;column-gap:12px}
.has-logo .logo-slot{grid-column:1;grid-row:1 / span 2}
.has-logo .card-title,.has-logo .card-desc{grid-column:2}

/* Skeleton / Empty / Avatar / Separator */
.skeleton{background:var(--accent);border-radius:var(--r-md);animation:pulse 2s cubic-bezier(.4,0,.6,1) infinite}
@keyframes pulse{50%{opacity:.5}}
.empty{display:flex;flex-direction:column;align-items:center;text-align:center;gap:16px;padding:32px 24px;border:1px dashed var(--input);border-radius:var(--r-lg)}
.empty-media{width:40px;height:40px;border-radius:var(--r-md);background:var(--muted);display:flex;align-items:center;justify-content:center}
.empty-media .ic{width:20px;height:20px}
.empty-title{font-size:18px;line-height:28px;font-weight:600;letter-spacing:-.01em}
.empty-desc{max-width:360px;color:var(--muted-foreground)}
.avatar{width:32px;height:32px;border-radius:9999px;background:var(--muted);display:inline-flex;align-items:center;justify-content:center;font-size:12px;font-weight:500;flex:none}
.sep{height:1px;background:var(--border);margin:16px 0}

/* Toggle */
.toggles{display:flex;flex-wrap:wrap;gap:8px}
.toggle{min-height:32px;padding:0 12px;border-radius:var(--r-md);border:1px solid var(--input);background:transparent;font-size:13px;font-weight:500;cursor:pointer;transition:background-color .15s,color .15s,border-color .15s}
.toggle:hover{background:var(--muted)}
.toggle[aria-pressed="true"]{background:var(--accent);color:var(--accent-foreground);border-color:var(--primary)}

/* Accordion */
.acc{border:1px solid var(--border);border-radius:var(--r-lg);background:var(--card)}
.acc summary{display:flex;align-items:center;justify-content:space-between;min-height:44px;padding:0 16px;font-weight:500;cursor:pointer;list-style:none;border-radius:var(--r-lg)}
.acc summary::-webkit-details-marker{display:none}
.acc summary:hover{text-decoration:underline}
.acc summary .ic{color:var(--muted-foreground);transition:transform .2s}
.acc[open] summary .ic{transform:rotate(180deg)}
.acc-body{display:grid;gap:16px;padding:8px 16px 16px}

/* Dialog / Drawer */
dialog{border:1px solid var(--border);padding:0;background:var(--background);color:var(--foreground);width:100%;max-width:512px;max-height:90vh;max-height:90dvh;margin:auto auto 0;border-radius:var(--r-xl) var(--r-xl) 0 0;box-shadow:var(--shadow-lg);overflow:hidden}
dialog[open]{display:flex;flex-direction:column;animation:enter .2s ease-out}
dialog::backdrop{background:var(--overlay)}
dialog::before{content:"";display:block;flex:none;width:100px;height:6px;border-radius:9999px;background:var(--muted);margin:12px auto 0}
@keyframes enter{from{transform:translateY(16px);opacity:0}to{transform:none;opacity:1}}
.dialog-header{display:grid;gap:6px;padding-block-start:16px;padding-inline:24px 56px}
.dialog-title{font-size:18px;line-height:24px;font-weight:600;letter-spacing:-.01em}
.dialog-desc{font-size:13px;line-height:20px;color:var(--muted-foreground)}
.dialog-body{padding:16px 24px 24px;overflow-y:auto;flex:1}
.dialog-footer{display:flex;flex-direction:column-reverse;gap:8px;padding:16px 24px calc(16px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--border)}
.dialog-close{position:absolute;top:8px;inset-inline-end:8px;width:44px;height:44px;display:flex;align-items:center;justify-content:center;border:0;background:none;border-radius:var(--r-sm);color:var(--foreground);opacity:.7;cursor:pointer;transition:opacity .15s}
.dialog-close:hover{opacity:1}
.bullets{display:grid;gap:8px}
.bullets li{position:relative;padding-inline-start:16px}
.bullets li::before{content:"";position:absolute;inset-inline-start:0;top:8px;width:4px;height:4px;border-radius:9999px;background:var(--muted-foreground)}
.done:not(.st):not(.tk){display:flex;flex-direction:column;align-items:center;text-align:center;gap:12px;padding:16px 0}
.done-badge{width:48px;height:48px;border-radius:9999px;background:var(--success-bg);color:var(--success);display:flex;align-items:center;justify-content:center}
.done-badge .ic{width:24px;height:24px}
.person{display:grid;gap:8px;padding:16px;border:1px solid var(--border);border-radius:var(--r-lg)}
.person + .person{margin-top:12px}
.person-top{display:flex;align-items:center;gap:12px}
.person-top strong{font-weight:500;display:block}
.dialog-body .sep{margin:20px 0}

/* Logos */
.logo{display:block;width:40px;height:40px;flex:none;border-radius:var(--r-md);object-fit:cover;background:var(--card);border:1px solid var(--border)}
.logo.lg{width:56px;height:56px;border-radius:var(--r-lg)}
.logo.sm{width:32px;height:32px}
.logo-pick{display:flex;align-items:center;gap:12px}
.sr:focus-visible + label{outline:2px solid var(--ring);outline-offset:2px}

/* Job page */
.employer{display:flex;align-items:center;gap:12px}
.employer strong{display:block;font-weight:500}
.facts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.fact{display:flex;gap:12px;align-items:flex-start;padding:12px;border:1px solid var(--border);border-radius:var(--r-lg);min-width:0}
.fact.wide{grid-column:1 / -1;background:var(--card)}
.fact-ic{width:32px;height:32px;border-radius:var(--r-md);background:var(--muted);display:flex;align-items:center;justify-content:center;flex:none}
.fact small{display:block;font-size:12px;line-height:16px;color:var(--muted-foreground)}
.fact strong{display:block;font-weight:500;overflow-wrap:anywhere}
.fact.wide strong{color:var(--primary);font-size:16px;line-height:24px;unicode-bidi:isolate}
.steps{counter-reset:s;display:grid;gap:12px}
.steps li{display:flex;gap:12px;align-items:flex-start}
.steps li::before{counter-increment:s;content:counter(s);width:24px;height:24px;border-radius:9999px;background:var(--muted);font-size:12px;font-weight:500;display:flex;align-items:center;justify-content:center;flex:none}
.alert{display:flex;gap:12px;padding:12px 16px;border:1px solid var(--border);border-radius:var(--r-lg);background:var(--card)}
.alert .ic{margin-top:2px;color:var(--primary);width:18px;height:18px}
.alert strong{display:block;font-weight:500}
.similar{display:grid;gap:8px}
.sim{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;min-height:44px;padding:12px;border:1px solid var(--border);border-radius:var(--r-lg);background:transparent;text-align:start;cursor:pointer;transition:background-color .15s}
.sim:hover{background:var(--accent)}
.sim strong{display:block;font-weight:500}
.job-top{margin-bottom:8px}
.job-head{display:grid;gap:12px}
.job-head .page-desc{margin-top:0}
.job-layout{display:grid;gap:24px;margin-top:24px}
.job-side{order:-1}
.job-side .card{padding:16px;gap:16px}
.side-actions{display:none}
.job-main{max-width:720px}
.job-main section{margin-bottom:32px}
.job-main section:last-child{margin-bottom:0}
.job-main .h2{margin-bottom:12px}
.apply-bar{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;gap:8px;padding:12px var(--gutter) calc(12px + env(safe-area-inset-bottom,0px));background:var(--background);border-top:1px solid var(--border)}
.apply-bar .btn.primary{flex:1}
body.on-job .nav{display:none}
body.on-job main{padding-bottom:calc(96px + env(safe-area-inset-bottom,0px))}
body.on-job .toast{bottom:calc(88px + env(safe-area-inset-bottom,0px))}

/* Job list rows */
.jobs{display:flex;flex-direction:column;gap:12px}
.job-row{position:relative;display:grid;grid-template-columns:48px minmax(0,1fr) auto;grid-template-areas:"logo main save" "tags tags tags" "meta meta meta";gap:12px;align-items:center;padding:16px;background:var(--card);border:1px solid var(--border);border-radius:var(--r-xl);box-shadow:var(--shadow-xs);transition:background-color .15s,border-color .15s}
.job-row:hover{border-color:color-mix(in oklab,var(--foreground) 25%,var(--border))}
.row-logo{grid-area:logo;display:flex;align-self:start}
.row-main{grid-area:main;min-width:0}
.row-tags{grid-area:tags}
.row-meta{grid-area:meta;display:flex;justify-content:space-between;align-items:center;gap:12px}
.row-save{grid-area:save;align-self:start;position:relative;z-index:1;margin-block-start:-8px;margin-inline-end:-8px}
.row-title{font-size:16px;line-height:24px;font-weight:600;letter-spacing:-.01em}
.row-sub{color:var(--muted-foreground)}
.job-row .card-link::after{border-radius:var(--r-xl)}
.card-action{grid-column:3;grid-row:1 / span 2;justify-self:end;margin-block-start:-8px;margin-inline-end:-8px;position:relative;z-index:1}

/* Sidebar filters */
.jobs-layout{display:block}
.filters-side{display:none}
.side-head{display:flex;align-items:center;justify-content:space-between;min-height:32px;margin-bottom:8px}
.side-label{font-size:12px;line-height:16px;font-weight:500;letter-spacing:.02em;text-transform:uppercase;color:var(--muted-foreground);margin:20px 0 4px}
.opts{display:grid;gap:2px}
.opt{display:flex;align-items:center;gap:12px;width:100%;min-height:32px;padding:0 8px;border:0;border-radius:var(--r-md);background:transparent;text-align:start;cursor:pointer;font-size:13px;transition:background-color .15s}
.opt:hover{background:var(--accent)}
.opt-box{width:16px;height:16px;border-radius:9999px;border:1px solid var(--input);flex:none;display:flex;align-items:center;justify-content:center;background:var(--background)}
.opt[aria-pressed="true"] .opt-box{border-color:var(--primary)}
.opt[aria-pressed="true"] .opt-box::after{content:"";width:8px;height:8px;border-radius:9999px;background:var(--primary)}
.opt[aria-pressed="true"] .opt-text{font-weight:500}
.opt-text{flex:1;min-width:0}
.opt-count{font-size:12px;color:var(--muted-foreground)}
.opt.zero:not([aria-pressed="true"]){opacity:.5}

/* Forms + toolbar */
.toolbar{display:flex;gap:8px;margin-top:24px}
.tokens{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:12px}
.tokens:empty{display:none}
.count{margin:16px 0 12px}
.form{display:grid;gap:16px;max-width:680px;margin-top:24px}
.row{display:grid;gap:16px}

.back{margin-inline-start:-12px}

/* Sonner toast (inverted, like the preset's menu color) */
.toast{position:fixed;left:16px;right:16px;bottom:calc(64px + 16px + env(safe-area-inset-bottom,0px));z-index:60;display:flex;align-items:center;justify-content:space-between;gap:12px;max-width:356px;margin:0 auto;padding:10px;padding-inline:16px 12px;border-radius:var(--r-lg);background:var(--foreground);color:var(--background);box-shadow:var(--shadow-lg);font-size:13px;line-height:20px;animation:enter .2s ease-out}

  .job-row{grid-template-columns:48px minmax(0,1.5fr) minmax(0,1.1fr) 176px 36px;grid-template-areas:"logo main tags meta save";gap:16px;padding-block:14px;padding-inline:20px 12px;border:0;border-bottom:1px solid var(--border);border-radius:0;box-shadow:none}
  .job-row:last-child{border-bottom:0}

  .row-logo,.row-tags,.row-save{align-self:center}

  .filters-side{display:block;position:sticky;top:76px;max-height:calc(100vh - 100px);overflow-y:auto;padding-inline-end:8px}

}

/* Hero + search */
.hero{padding-block:4px 0}
.hero-title{font-family:var(--font-heading);font-size:32px;line-height:36px;font-weight:600;letter-spacing:-.03em;max-width:15ch;text-wrap:balance}

.sb-filters .dot{position:absolute;top:2px;inset-inline-end:2px;min-width:16px;height:16px;padding:0 4px;border-radius:9999px;background:var(--primary);color:var(--primary-foreground);font-size:10px;line-height:16px;font-weight:600;text-align:center}
.suggest{display:flex;align-items:center;gap:8px;margin:12px calc(var(--gutter) * -1) 0;padding:2px var(--gutter);overflow-x:auto;scrollbar-width:none}
.suggest::-webkit-scrollbar{display:none}

.sug{flex:none;min-height:36px;padding:0 14px;border-radius:9999px;border:1px solid var(--input);background:transparent;font-size:13px;font-weight:500;white-space:nowrap;cursor:pointer;transition:background-color .15s,border-color .15s}
.sug:hover{background:var(--accent)}

  .job-layout{grid-template-columns:minmax(0,1fr) 320px;gap:32px}
  .job-side{position:sticky;top:72px}
  .apply-card{display:grid}
}
/* Post flow */
.stepper{display:flex;gap:8px;margin-top:8px}
.st{flex:1;display:grid;gap:6px}
.st-bar{height:4px;border-radius:9999px;background:var(--border)}
.st.on .st-bar,.st.done .st-bar{background:var(--primary)}
.st-l{font-size:12px;line-height:16px;font-weight:500;color:var(--muted-foreground)}
.st.on .st-l{color:var(--foreground)}
.tpl{display:grid;gap:8px;padding:12px;border:1px dashed var(--input);border-radius:var(--r-lg)}
.tpl-row{display:flex;flex-wrap:wrap;gap:8px}
.check{display:flex;align-items:center;gap:10px;min-height:44px;cursor:pointer;font-weight:400}
.check-box{width:18px;height:18px;border-radius:var(--r-sm);border:1px solid var(--input);display:flex;align-items:center;justify-content:center;flex:none;color:var(--primary-foreground);background:var(--background)}
.check-box .ic{width:12px;height:12px;opacity:0}
.check input:checked + .check-box{background:var(--primary);border-color:var(--primary)}
.check input:checked + .check-box .ic{opacity:1}
.check input:focus-visible + .check-box{outline:2px solid var(--ring);outline-offset:2px}
.preview{pointer-events:none}
.posted-actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:20px;justify-content:center}

/* Sidebar v2 */
.filters-side{padding:12px !important;background:var(--card);border:1px solid var(--border);border-radius:var(--r-xl);box-shadow:var(--shadow-xs)}
.side-head{gap:8px;padding-inline:4px;margin-bottom:4px}
.side-head .btn{margin-inline-start:auto}
.sg + .sg{border-top:1px solid var(--border);margin-top:6px;padding-top:6px}
.sg-head{display:flex;align-items:center;gap:8px;width:100%;min-height:36px;padding:0 8px;border:0;border-radius:var(--r-md);background:none;font-size:13px;font-weight:600;text-align:start;cursor:pointer;transition:background-color .15s}
.sg-head:hover{background:var(--accent)}
.sg-head .ic{margin-inline-start:auto;flex:none;color:var(--muted-foreground);transition:transform .2s}
.sg-head[aria-expanded="false"] .ic{transform:rotate(-90deg)}
.sg-sel{font-weight:400;font-size:12px;color:var(--primary);max-width:96px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sg-head .sg-sel + .ic{margin-inline-start:0}
.sg-head .sg-sel{margin-inline-start:auto}
.sg .opts{margin-top:2px}
.opt[aria-pressed="true"]{background:color-mix(in oklab,var(--primary) 10%,transparent)}
.sg-more{margin-top:2px;min-height:32px;padding:0 8px;border:0;background:none;color:var(--primary);font-size:12px;font-weight:500;text-align:start;cursor:pointer;border-radius:var(--r-md)}
.sg-more:hover{background:var(--accent)}
@media (min-width:768px){
  .row-tags{flex-direction:column;flex-wrap:nowrap;align-items:flex-start;gap:6px}
}

/* Applications */
.card .btn{position:relative;z-index:1}
.track{display:flex;gap:6px}
.tk{flex:1;display:grid;gap:6px;min-width:0}
.tk-dot{height:4px;border-radius:9999px;background:var(--border)}
.tk.done .tk-dot,.tk.on .tk-dot{background:var(--primary)}
.tk-l{font-size:11px;line-height:14px;color:var(--muted-foreground);overflow-wrap:anywhere}
.tk.on .tk-l{color:var(--foreground);font-weight:500}
.tab-n{margin-inline-start:6px;font-size:12px;color:var(--muted-foreground);font-weight:400}
.card.pad{padding:14px 16px;gap:10px}
.card.pad .flist{margin:0}
.card.pad .frow:first-child{border-top:0}
.person-actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.input.sm{width:auto;min-height:36px;height:36px;padding-inline:10px 28px;font-size:13px}
.nav .nav-ic{position:relative}
.nav-dot{position:absolute;top:2px;inset-inline-end:8px;width:9px;height:9px;border-radius:9999px;background:var(--destructive);border:2px solid var(--background)}
.topnav-link .badge.default{min-width:20px;padding:0 6px}
.apcard .card-footer{justify-content:flex-start}

/* Listing card: title, business and location stacked */
.row-sub{margin-top:2px;font-size:13px;line-height:18px}
.row-loc{display:flex;align-items:center;gap:4px;margin-top:2px;font-size:13px;line-height:18px;color:var(--muted-foreground)}
.row-loc .ic{width:13px;height:13px;flex:none}
.row-loc span{min-width:0;overflow-wrap:anywhere}

/* Top nav alignment: one control height, one centre line */
.top{--hc:44px}
.top .wrap{height:56px;align-items:center}
.top .brand{height:var(--hc);align-items:center}
.top .btn{height:var(--hc);min-height:var(--hc)}
.top .btn.icon{width:var(--hc)}
.top .btn.sm{height:var(--hc);min-height:var(--hc)}
.top .top-search{height:var(--hc);margin-block:0}
.top .menu-wrap{display:flex;align-items:center;height:var(--hc)}
.top .top-actions{align-items:center}
.top .country-btn{gap:6px}
.top .lang-btn{min-width:var(--hc);padding-inline:8px}
.top .acct-btn{padding:0}
.row-logo .logo{width:48px;height:48px;border-radius:var(--r-lg)}
@media (min-width:768px){
  .top{--hc:36px}
  .top .wrap{gap:8px}
  .top .country-wrap{position:relative;padding-inline-start:12px;margin-inline-start:4px}
  .top .country-wrap::before{content:"";position:absolute;inset-inline-start:0;top:50%;width:1px;height:20px;background:var(--border);transform:translateY(-50%)}
  .top .topnav{margin-inline-start:8px;gap:4px}
  .top .topnav-link{padding-inline:12px}
  .top .topnav-link .badge{margin-inline-start:2px}
}

/* Top nav: icons sat on the text baseline, which lifted them above the copy */
.ic{display:block}
#post-ic,#bell-ic,#cflag,#cchev,.ts-ic{display:flex;align-items:center;justify-content:center;line-height:0}
#ctext{display:block;line-height:20px}
.top .btn{line-height:20px}
.top .brand-word{display:block;line-height:28px}
.top .brand-word small{line-height:16px}
.top .topnav-link{align-items:center}

/* Employers */
.emp-chev{display:flex;align-items:center;justify-content:center;width:36px;height:36px;color:var(--muted-foreground);transform:rotate(-90deg)}
[dir="rtl"] .emp-chev{transform:rotate(90deg)}
.emp-row .row-sub{margin-top:2px;color:var(--muted-foreground)}
.emp-body{margin-top:16px}
.emp-body section{margin-bottom:24px}
.mbadge{margin-inline-start:auto;font-size:12px;color:var(--muted-foreground)}
.acct-btn{position:relative}
.acct-btn .nav-dot{top:6px;inset-inline-end:5px}

/* v4: job page, company template, posting form, activity, webhooks */
.skip{position:absolute;inset-inline-start:8px;top:-64px;z-index:200;padding:10px 14px;border-radius:var(--r-md);background:var(--primary);color:var(--primary-foreground);font-weight:500}
.skip:focus{top:8px}
.banner{display:flex;gap:10px;align-items:flex-start;margin-top:12px;padding:12px 14px;border:1px solid var(--border);border-radius:var(--r-lg);font-size:14px;line-height:20px;background:var(--card)}
.banner .ic{flex:none;margin-top:2px}
.banner.warn{background:color-mix(in oklab,oklch(.8 .16 80) 22%,var(--card));border-color:oklch(.75 .15 80)}
.banner.info{background:color-mix(in oklab,var(--primary) 12%,var(--card));border-color:var(--primary)}
.chips,.tabs,.share-row{display:flex;flex-wrap:wrap;gap:8px}
.tabs{margin:16px 0}
.perks{list-style:none;margin:0;padding:0;display:grid;gap:8px}
@media (min-width:640px){.perks{grid-template-columns:1fr 1fr}}
.perks li{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--border);border-radius:var(--r-lg);background:var(--card)}
.perks .ic{flex:none;color:var(--accent-foreground)}
.mini{list-style:none;margin:0;padding:0;display:grid;gap:6px;font-size:13px;color:var(--muted-foreground)}
.mini li{display:flex;align-items:center;gap:8px}
.tips{margin:0;padding-inline-start:18px;display:grid;gap:6px;font-size:13px;color:var(--muted-foreground)}
.radio{display:flex;align-items:center;gap:10px;min-height:44px;padding:10px 12px;border:1px solid var(--border);border-radius:var(--r-lg);background:var(--card);cursor:pointer}
.radio input{width:18px;height:18px;accent-color:var(--primary)}
fieldset.field-group{border:0;padding:0;margin:0;display:grid;gap:8px}
.co-card{padding:0;overflow:hidden}
.co-cover{height:96px}
@media (min-width:768px){.co-cover{height:128px}}
.co-head{display:grid;gap:12px;padding:0 16px 20px;margin-top:-36px}
@media (min-width:768px){.co-head{padding-inline:24px}}
.co-logo{display:block;width:72px;height:72px;border-radius:16px;border:4px solid var(--card);overflow:hidden;background:var(--card)}
.co-logo .logo{width:100%;height:100%;border-radius:0}
.notes,.dlvs{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.note{display:flex;align-items:center;gap:12px;padding:12px;border:1px solid var(--border);border-radius:var(--r-lg);background:var(--card)}
.note.unread{border-color:var(--primary);background:color-mix(in oklab,var(--primary) 8%,var(--card))}
.note-ic{flex:none;display:grid;place-items:center;width:36px;height:36px;border-radius:999px;background:var(--muted)}
.note-body{flex:1;min-width:0}.note-body p{margin:0}
.dlv{padding:12px;border:1px solid var(--border);border-radius:var(--r-lg);background:var(--card);display:grid;gap:6px}
.dlv-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
pre,.code{margin:0;padding:12px;border-radius:var(--r-lg);background:var(--muted);overflow-x:auto;font:12px/18px ui-monospace,SFMono-Regular,Menlo,monospace;white-space:pre}
code{font:12px ui-monospace,SFMono-Regular,Menlo,monospace;background:var(--muted);padding:1px 6px;border-radius:6px}
.badge.danger{background:color-mix(in oklab,var(--destructive,oklch(.58 .2 27)) 14%,var(--card));color:var(--destructive,oklch(.5 .2 27))}
.btn.danger{color:var(--destructive,oklch(.5 .2 27))}
.card-footer.wrap{flex-wrap:wrap;justify-content:flex-start;gap:8px}
.sim.static{cursor:default}
.hook .card-header{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}

/* Responsive header: phones show logo, country, search, bell and account only.
   Post lives in the bottom tab bar; language lives in the account menu. */
@media (max-width:767px){
  .top .post-cta,.top .lang-btn,.top .top-search,.top .topnav{display:none}
  .top .wrap{gap:4px}
  .top .country-wrap{flex:0 1 auto;min-width:0}
  .top .country-btn{min-width:0;max-width:100%}

  .top .topnav{margin-inline-start:4px;gap:0;flex:0 1 auto;min-width:0}
  .top .topnav-link{padding-inline:8px}

}

@media (min-width:640px){.facts.ev .frow{grid-template-columns:minmax(0,220px) 1fr;gap:12px}}

.card.addr{display:flex;flex-direction:row;align-items:center;gap:12px;padding:14px;flex-wrap:wrap}
@media (max-width:639px){.facts{grid-template-columns:1fr}.facts .frow{align-items:flex-start}}
.addr-ic{flex:none;display:grid;place-items:center;width:40px;height:40px;border-radius:999px;background:var(--muted)}
.addr-text{flex:1 1 180px;min-width:0;display:grid;gap:2px;overflow-wrap:anywhere}
.addr-line{display:flex;gap:6px;align-items:flex-start;margin:0;font-size:13px;line-height:18px;color:var(--muted-foreground)}

.offices{display:grid;gap:8px}

.listbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:16px 0 12px}
.listbar .count{margin:0}
.sortsel select{width:auto;min-width:140px}
.badge.warn{background:color-mix(in oklab,oklch(.8 .16 80) 28%,var(--card));color:oklch(.42 .1 70)}

.stats.n3{grid-template-columns:1fr 1fr}
.stats.n3 .stat:first-child{grid-column:1/-1}
@media (min-width:768px){.stats.n3{grid-template-columns:repeat(3,1fr)}.stats.n3 .stat:first-child{grid-column:auto}}
.stat.warn{border-color:oklch(.75 .15 80);background:color-mix(in oklab,oklch(.8 .16 80) 18%,var(--card))}

  input,select,textarea,.input,.input.sm,.sb-input,.sb-select{font-size:16px}
  select.input,.input.sm{min-height:44px}
  .btn.sm,.toggle,.sug,.topnav-link,.country-btn{min-height:44px}

  .jh-actions .btn{min-height:44px}
}

function stepErrors(n){
  var D = S.draft, e = [];
  if (n === 1){
    if (D.title.trim().length < 3) e.push(["title","Add a clear job title."]);
    if (D.company.trim().length < 2) e.push(["company","Add your business name."]);
    if (D.town.trim().length < 2) e.push(["town","Add the town or city."]);
  } else if (n === 2){
    if (D.desc.trim().length < 30) e.push(["desc","Add at least a couple of sentences (30+ characters)."]);
  } else if (n === 3){
    var v = digitsOnly(D.vacancies); if (!v || Number(v) < 1 || Number(v) > 999) e.push(["vac","Enter how many people you want to hire (1 or more)."]);
  } else if (n === 4){
    if (!D.negotiable){
      var mn = digitsOnly(D.min), mx = digitsOnly(D.max);
      if (mx && (!mn || Number(mx) < Number(mn))) e.push(["min","Add a starting pay that is no higher than the maximum."]);
    }

    if (D.pWhatsapp.trim() && !normPhone(D.pWhatsapp, D.country)) e.push(["pwa","Enter a WhatsApp number, like +254 712 345 678."]);
  }
  return e;
}

    desc:D.desc.trim(), reqs:reqs.length ? reqs : ["Details shared when you apply"], resp:lines(D.resp), benefits:D.benefits.slice(), schedule:D.schedule, hours:D.hours.trim(),
    vacancies:Number(digitsOnly(D.vacancies)) || 1, expReq:D.expReq, edu:D.edu, langs:D.langs.slice(), workMode:D.workMode, maxApplicants:Number(D.autoClose) || 0};

var nextNote = 1;

var TRIGGERS = {
  "application.submitted":[function(e){
    var j = byId(e.data.jobId); if (!j) return;
    note("seeker","app","Application received: "+j.title+" at "+j.company, j.id);

  }],

    S.alerts.forEach(function(a){ if (matchJob(j, a.f, a.q)){ a.unread = true; hits++; emit("alert.matched", {alertId:a.id, jobId:j.id}); } });

function emit(type, data){
  if (REMOTE) return {type:type};

function runScheduled(){
  if (REMOTE) return;
  var now = Date.now(), changed = false;
  jobs.forEach(function(j){
    if (!j.closed && isExpired(j) && !j.expiredNoted){ j.expiredNoted = true; changed = true; emit("job.expired", {jobId:j.id}); }
    var dl = daysLeft(j);
    if (isLive(j) && dl <= 3 && S.saved[j.id] && !S.reminded[j.id]){
      S.reminded[j.id] = true; changed = true;
      note("seeker","reminder", j.title+(dl <= 0 ? " closes today" : dl === 1 ? " closes tomorrow" : " closes in "+dl+" days"), j.id);
    }
    if (j.mine && isLive(j) && !S.stale[j.id]){
      var waiting = (apps[j.id] || []).filter(function(a){ return a.status === "new" && now - a.at > 3*DAY; }).length;

}

function syncRoute(){
  var h = location.hash, m;
  S.job = null; S.page = null; S.pid = null;
  if ((m = h.match(/^#\/post\/([1234])$/))){ if (S.tab !== "post") S.prevTab = S.tab; S.tab = "post"; S.step = Number(m[1]); return; }
  if (S.tab === "post") S.tab = S.prevTab && S.prevTab !== "post" ? S.prevTab : (S.role === "employer" ? "postings" : "jobs");
  if ((m = h.match(/^#\/posted\/(\d+)$/))){ S.page = "posted"; S.pid = Number(m[1]); return; }
  if (h === "#/activity"){ S.page = "activity"; return; }
  if ((m = h.match(/^#\/company\/edit\/(.+)$/))){ S.page = "companyedit"; try { S.pname = decodeURIComponent(m[1]); } catch(err){ S.pname = m[1]; } return; }
  if ((m = h.match(/^#\/employer\/(.+)$/))){ S.page = "employer"; try { S.pname = decodeURIComponent(m[1]); } catch(err){ S.pname = m[1]; } return; }
  if ((m = h.match(/^#\/job\/(\d+)\/apply$/))){ S.page = "apply"; S.pid = Number(m[1]); }
  else if ((m = h.match(/^#\/job\/(\d+)/))) S.job = Number(m[1]);
  else if ((m = h.match(/^#\/postings\/(\d+)$/))){ S.page = "applicants"; S.pid = Number(m[1]); S.tab = "postings"; }
  else if (/^#\/(filters|alerts|signin)$/.test(h)) S.page = h.slice(2);
}
window.addEventListener("hashchange", function(){

  if (prevKey) S.ys[prevKey] = window.scrollY;
  S.applyDone = null; syncRoute(); render(true);
  var nowKey = (S.job || S.page) ? null : S.tab;
  if (nowKey && !prevKey && S.ys[nowKey] != null){ var y = S.ys[nowKey]; S.ys[nowKey] = null; window.scrollTo(0, y); }
});

var CFG = window.KAZI_CONFIG || {}, REMOTE = !!(CFG.url && CFG.key && window.supabase), db = null;

function rerr(e){
  if (!e) return "Something went wrong. Please try again.";
  if (e.hint) return e.hint;
  var m = String(e.message || "");
  if (e.code === "23505") return /applications/.test(m) ? "You already applied to this job." : "That name is already in use.";
  if (e.code === "23514") return "Some details are not valid. Check the form and try again.";
  if (e.code === "42501" || /row-level security|permission denied/i.test(m)) return "You do not have permission to do that. Try signing in again.";
  if (/Failed to fetch|NetworkError|Load failed|network/i.test(m)) return "Can't reach the server. Check your connection and try again.";
  if (/rate limit|too many/i.test(m)) return "Too many tries. Please wait a few minutes and try again.";
  if (/otp|token|expired|invalid/i.test(m)) return "That code did not work. Check it or ask for a new one.";
  return "Something went wrong. Please try again.";
}

R.boot = async function(){
  db = window.supabase.createClient(CFG.url, CFG.key, {
    auth:{flowType:"pkce", persistSession:true, autoRefreshToken:true, detectSessionInUrl:true},
    global:{fetch:function(u, o){
      var c = new AbortController(), t = setTimeout(function(){ c.abort(); }, 20000); o = o || {};
      if (o.signal){ if (o.signal.aborted) c.abort(); else o.signal.addEventListener("abort", function(){ c.abort(); }); }
      return fetch(u, Object.assign({}, o, {signal:c.signal})).finally(function(){ clearTimeout(t); });
    }}
  });
  db.auth.onAuthStateChange(function(ev, session){
    setTimeout(function(){
      if (ev === "SIGNED_IN" && session && (!S.user || S.user.id !== session.user.id)) R.afterSignIn(session.user);
      else if (ev === "SIGNED_OUT" && S.user) R.clearUser();
    }, 0);
  });
  try {
    var s = await db.auth.getSession(); if (s.data && s.data.session) await R.loadProfile(s.data.session.user);
    await R.loadPublic(); if (S.user) await R.loadMine();
    S.loadError = false;
  } catch(err){ S.loadError = true; }
  S.loading = false; render(false);
  setInterval(R.poll, 60000);
  document.addEventListener("visibilitychange", function(){ if (!document.hidden) R.poll(); });
};
R.n = 0;

    if (R.n % 5 === 0){ await R.loadPublic(); if (S.user) jobs.forEach(function(j){ j.mine = j.ownerId === S.user.id; }); }
    if (S.user){ await R.loadMine(); }
    renderNav(); renderBell();

    if (!typing && !S.job && (!S.page || S.page === "activity" || S.page === "applicants") && ["jobs","saved","applications","postings","employers"].indexOf(S.tab) >= 0) render(false);
  } catch(err){}

R.ensureCompany = async function(name, D){

      if (Number(D.closesIn)) row.closes_at = new Date(Date.now() + Number(D.closesIn)*DAY).toISOString();

  return true;
};
R.delAlert = async function(id){ var r = await db.from("alerts").delete().eq("id", id); if (r.error) toast(rerr(r.error)); };
R.reAddAlert = async function(a){
  var r = await db.from("alerts").insert({user_id:S.user.id, query:a.q || "", country:a.f.country || null, category:a.f.category || null, type:a.f.type || null, phone:a.phone || null}).select().single();
  if (r.data){ var x = S.alerts.find(function(y){ return y === a; }); if (x) x.id = r.data.id; } else if (r.error) toast(rerr(r.error));
};
R.persistPrefs = function(){
  try {
    var seen = R.seenMap(); S.myApps.forEach(function(m){ if (m.aid) seen[m.aid] = m.seen; });
    localStorage.setItem(KEY+":seen", JSON.stringify(seen));
    localStorage.setItem(KEY+":r", JSON.stringify({v:2, role:S.role, theme:S.theme, lang:LANG, dir:document.documentElement.dir, country:S.f.country, draft:S.draft, saved:S.user ? {} : S.saved, lastApply:S.lastApply, returnTo:S.returnTo}));
  } catch(err){}
};
R.loadPrefs = function(){
  try {
    var d = JSON.parse(localStorage.getItem(KEY+":r") || "null"); if (!d || d.v !== 2) return;
    S.role = d.role === "employer" ? "employer" : "seeker"; S.theme = d.theme || "system";
    if (d.lang === "sw" || d.lang === "en") LANG = d.lang;
    if (d.dir === "rtl" || d.dir === "ltr") document.documentElement.dir = d.dir;
    S.f.country = d.country && COUNTRIES[d.country] ? d.country : null;
    if (d.draft && typeof d.draft === "object") S.draft = Object.assign(newDraft(), d.draft);
    S.saved = d.saved || {}; S.lastApply = d.lastApply || null; S.returnTo = d.returnTo || null;
  } catch(err){}
};
if (REMOTE){ jobs.length = 0; apps = {}; COMPANY = {}; S.compIds = {}; S.loading = true; }
R.signinSubmit = function(){
  var a = S.auth || (S.auth = {step:"email", email:"", name:"", busy:false, err:""});
  if (a.step === "code"){
    var ci = $("#s-code"), code = (ci.value || "").replace(/\s/g, ""), okc = /^\d{6,8}$/.test(code);
    setErr("es-code", okc ? "" : "Enter the 6 to 8 digit code from your email.", ci);
    if (!okc){ ci.focus(); return; }
    R.verify(code); return;
  }
  var n = $("#s-name"), e = $("#s-email"), nm = n.value.trim(), em = e.value.trim().toLowerCase();
  var okn = nm.length >= 2, oke = /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(em);
  setErr("es-name", okn ? "" : "Enter your full name.", n);
  setErr("es-email", oke ? "" : "Enter a valid email address, like name@example.com.", e);
  if (!okn || !oke){ (okn ? e : n).focus(); return; }
  a.name = nm; a.email = em; a.busy = true; a.err = ""; renderSignin(); R.sendCode(nm, em);
};
R.reload = async function(){
  try { await R.loadPublic(); if (S.user) await R.loadMine(); S.loadError = false; } catch(err){ S.loadError = true; }
  S.loading = false; render(false);
};

loadState();
normalizeApps();
syncRoute();
render(false);
updateLangBtn();
if (LANG === "sw") startI18n();
if (REMOTE){ R.boot(); } else {
runScheduled(); setInterval(runScheduled, 60000);
setTimeout(function(){ S.loading = false; if (!S.job && !S.page && S.tab==="jobs") updateJobs(); }, 700);
}
})();
</script>
</body>
